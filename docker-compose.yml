services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urban
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urban
      JWT_SECRET: ${JWT_SECRET:-973feb758c1b75f8eb452e732f71e51a27bcc0725dfff4a9951f54091787bab8}
      NODE_ENV: development
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:5173
      PORT: "5000"
    ports:
      - "5002:5000"
    volumes:
      - ./api:/app
      - ./shared:/shared
      - ./shared:/app/shared
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      API_TARGET: http://api:5000
      VITE_API_URL: ""
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - ./shared:/shared
      - ./shared:/app/shared
      - client_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  db_data:
  api_node_modules:
  client_node_modules:

